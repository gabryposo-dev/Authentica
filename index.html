<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Authentica</title><style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;color:#fff;font-family:-apple-system,sans-serif}
.hdr{padding:20px;text-align:center;border-bottom:1px solid #222}
.pills{display:flex;gap:8px;overflow-x:auto;padding:12px 16px}
.pill{padding:8px 16px;border-radius:20px;background:#1a1a1a;border:1px solid #333;color:#888;white-space:nowrap}
.pill.act{background:#fff;color:#000;border-color:#fff;font-weight:700}
.cam-wrap{position:relative;width:100%;height:55vh;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center}
#bgBag{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.5}
#video{position:relative;z-index:2;width:100%;height:100%;object-fit:cover}
.msg{position:absolute;z-index:3;background:rgba(0,0,0,.8);padding:20px;border-radius:12px;text-align:center}
.btn{background:#fff;color:#000;padding:12px 24px;border-radius:24px;border:none;font-weight:700;margin-top:12px}
.sheet{background:#141414;border-radius:24px 24px 0 0;padding:24px;margin-top:-20px;position:relative;z-index:4}
.brand-img{width:100%;height:160px;object-fit:cover;border-radius:12px;margin-bottom:16px}
</style></head><body>
<div class="hdr"><h2>AUTHENTICA</h2><p style="color:#888;font-size:12px">SELEZIONA MAISON</p></div>
<div class="pills" id="pills"></div>
<div class="cam-wrap">
<img id="bgBag" src="https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=600&q=80">
<video id="video" autoplay muted playsinline></video>
<div class="msg" id="camMsg"><p>Attiva fotocamera per autenticazione AI</p><button class="btn" onclick="startCam()">Attiva Fotocamera</button><br><button class="btn" style="background:#222;color:#fff;margin-top:8px" onclick="noCam()">Continua senza camera - vedi sfondi brand</button></div>
</div>
<div class="sheet">
<img id="brandImg" class="brand-img" src="https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=600&q=80">
<h3 id="bName">Balenciaga Hourglass XS</h3>
<p id="bDesc" style="color:#888;margin:8px 0">Croco-embossed leather</p>
<button class="btn" style="width:100%">Verifica <span id="bBtn">Balenciaga</span> →</button>
</div>
<script>
const BRANDS=[
{n:"Balenciaga",img:"https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=600&q=80",d:"Hourglass XS - Croco"},
{n:"Gucci",img:"https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=600&q=80",d:"Marmont - Matelassé"},
{n:"Louis Vuitton",img:"https://images.unsplash.com/photo-1591561954557-26941169b49e?w=600&q=80",d:"Neverfull - Monogram"},
{n:"Chanel",img:"https://images.unsplash.com/photo-1583792615411-3f53f6a3fa29?w=600&q=80",d:"Classic Flap"},
{n:"Prada",img:"https://images.unsplash.com/photo-1590874103328-eac38a683ce7?w=600&q=80",d:"Cleo - Re-Nylon"},
{n:"Hermès",img:"https://images.unsplash.com/photo-1591561954555-607968c989ab?w=600&q=80",d:"Birkin - Togo"},
{n:"Saint Laurent",img:"https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=600&q=80",d:"Sac De Jour"},
{n:"Dior",img:"https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=600&q=80",d:"Saddle - Oblique"}
];
let cur=0;
function renderPills(){
 document.getElementById('pills').innerHTML=BRANDS.map((b,i)=>`<button class="pill ${i==cur?'act':''}" onclick="pick(${i})">${b.n}</button>`).join('');
}
function pick(i){
 cur=i;
 document.getElementById('bgBag').src=BRANDS[i].img;
 document.getElementById('brandImg').src=BRANDS[i].img;
 document.getElementById('bName').innerText=BRANDS[i].n;
 document.getElementById('bBtn').innerText=BRANDS[i].n;
 document.getElementById('bDesc').innerText=BRANDS[i].d;
 renderPills();
}
function startCam(){
 navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(s=>{
   let v=document.getElementById('video'); v.srcObject=s; v.style.opacity='0.6';
   document.getElementById('camMsg').style.display='none';
 }).catch(()=>noCam());
}
function noCam(){
 document.getElementById('camMsg').style.display='none';
 document.getElementById('video').style.display='none';
 document.getElementById('bgBag').style.opacity='1';
}
renderPills();
</script></body></html>
