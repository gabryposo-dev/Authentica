<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Authentica</title>
<style>
  body { margin:0; background:#e8e0d5; font-family: -apple-system, sans-serif; display:flex; justify-content:center; align-items:center; min-height:100vh; }
  .phone { width:390px; height:780px; background:#f6f2ec; border-radius:40px; overflow:hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.15); position:relative; }
  .header { display:flex; justify-content:space-between; align-items:center; padding:20px 25px; background:white; }
  .header b { font-size:17px; }
  .camera { height:480px; background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://images.unsplash.com/photo-1590874103328-eac38a683ce7?auto=format&fit=crop&w=600'); background-size:cover; background-position:center; display:flex; flex-direction:column; align-items:center; padding-top:40px; position:relative; }
  .label { color:white; text-align:center; font-size:13px; }
  .label strong { display:block; font-size:14px; margin-bottom:5px; }
  .frame { width:260px; height:200px; border:1px solid rgba(255,255,255,0.7); position:relative; margin-top:30px; }
  .frame:before, .frame:after { content:''; position:absolute; width:20px; height:20px; border:2px solid white; }
  .frame:before { top:-2px; left:-2px; border-right:0; border-bottom:0; }
  .frame:after { bottom:-2px; right:-2px; border-left:0; border-top:0; }
  .sheet { background:#f6f2ec; border-radius:30px 30px 0 0; padding:25px; position:absolute; bottom:0; left:0; right:0; text-align:center; }
  .small { font-size:9px; color:#888; margin-bottom:15px; letter-spacing:0.5px; }
  .btn { background:#1a1a1a; color:#f6f2ec; padding:16px; border-radius:30px; font-size:20px; font-weight:600; border:none; width:100%; cursor:pointer; }
  .footer { display:flex; justify-content:space-around; margin-top:20px; color:#999; font-size:12px; }
  .footer .active { color:#1a1a1a; }
</style>
</head>
<body>
  <div class="phone">
    <div class="header"><span>‹</span><b>Autenticazione</b><span>ⓘ</span></div>
    <div class="camera">
      <div class="label"><strong>Inquadra il prodotto</strong>Posiziona la borsa Prada al centro del riquadro per la verifica</div>
      <div class="frame"></div>
      <div class="sheet">
        <div class="small">Rilevato: Borsa in nylon PRADA - Materiale: Nylon - Logo: Confermato</div>
        <button class="btn" onclick="alert('Verifica in corso... È AUTENTICA! ✨')">Verifica Autenticità</button>
        <div class="footer">
          <div class="active">▭<br>Armadio</div>
          <div>👚<br>Outfit</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
